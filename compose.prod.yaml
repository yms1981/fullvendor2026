# Stack para servidor: MVC + MariaDB + Memcached (+ Mailpit opcional).
# La app sigue montada desde el repo (./ → /var/www/html). En el servidor: git clone + este compose.
#
# Uso:
#   docker compose -f compose.prod.yaml build
#   docker compose -f compose.prod.yaml up -d
#
# Variables: copia a .env o exporta antes de up (MYSQL_*, BASE_URL, CI_ENV=production, etc.)

services:
  fullvendor:
    build:
      context: ./docker
      dockerfile: Dockerfile
      target: prod
    image: fullvendor/mvc-php:7.4-prod
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appfv2}
      MYSQL_USER: ${MYSQL_USER:-appfv2}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fullvendorPWD}
      MYSQL_HOST: database
      BASE_URL: ${BASE_URL:-https://test.fullvendor.com}
      MVC_TRUST_PROXY_HTTPS: ${MVC_TRUST_PROXY_HTTPS:-1}
      CI_ENV: ${CI_ENV:-production}
      MEMCACHED_HOST: memcached
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:test.fullvendor.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - database
      - memcached

  database:
    image: mariadb:10.6.16-focal
    restart: unless-stopped
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./docker/init.db:/docker-entrypoint-initdb.d:ro
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-appfv}
      MYSQL_USER: ${MYSQL_USER:-appfv}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fullvendorPWD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-toordrowssap}
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  memcached:
    image: memcached:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:11211:11211"

volumes:
  mysql_data_prod:
