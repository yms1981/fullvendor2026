# Proxy MVC (Apache) → contenedor Sail "laravel.test".
# Swagger UI: /api/v2/documentation + JSON/assets en /api/v2/docs (y legado /docs).
# Postman/API: http://localhost/api/v2/...  o  http://localhost:81/api/v2/...

<Location "/api/v2/">
    ProxyPass "http://laravel.test/api/v2/"
    ProxyPassReverse "http://laravel.test/api/v2/"
</Location>

# Legado: Swagger UI antiguo pedía /docs?api-docs.json → mismo endpoint bajo api/v2.
<Location "/docs">
    ProxyPass "http://laravel.test/api/v2/docs"
    ProxyPassReverse "http://laravel.test/api/v2/docs"
</Location>

# Legado assets antiguos /docs/asset/...
<Location "/docs/">
    ProxyPass "http://laravel.test/api/v2/docs/"
    ProxyPassReverse "http://laravel.test/api/v2/docs/"
</Location>
