services:
    api:
        image: ghcr.io/fullvendor/backend:latest
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            #- '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            -   '../../appfv/public_html/uploads:/var/www/mvc_uploads'
        restart: always
        env_file: .env
        networks:
            - sail
        depends_on:
            - memcached
    mailpit:
        image: 'axllent/mailpit:latest'
        restart: unless-stopped
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    memcached:
        image: 'memcached:alpine'
        restart: always
        ports:
            - '${FORWARD_MEMCACHED_PORT:-11211}:11211'
        networks:
            - sail

    mvc:
        image: ghcr.io/fullvendor/frontend:latest
        restart: always
        build:
            context: ../../
            dockerfile: docker/test/mvc/Dockerfile
        environment:
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_HOST: '${DB_HOST}'
            BASE_URL: '${APP_URL}'
            API_SERVER: 'api'
            CI_ENV: 'development'
            MEMCACHED_HOST: 'memcached'
            COOKIE_DOMAIN: '${APP_COOKIE_DOMAIN}'
            ENVIRONMENT: develop
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "8080:80"

        volumes:
            # Solo datos subidos por usuarios; las plantillas viven en companyasset/import-templates/
            - mvc-uploads:/var/www/html/uploads
        networks:
            - sail

    minio:
        image: 'minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: '${MINIO_ROOT_USER:-sail}'
            MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:-password}'
        volumes:
            - 'sail-minio:/data/minio'
        networks:
            - sail
        command: 'minio server /data/minio --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    mvc-uploads:
        driver: local
    sail-minio:
        driver: local