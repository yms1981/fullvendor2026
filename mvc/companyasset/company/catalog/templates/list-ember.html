<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{catalog_name}}</title>
<style>
:root {
  --fv-primary: #ea580c;
  --fv-primary-dark: #c2410c;
  --fv-on-primary: #fff;
  --fv-page-bg: #fff7ed;
  --fv-text: #1f2937;
  --fv-muted: #6b7280;
}
* { box-sizing:border-box; }
body {
  margin:0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--fv-page-bg); color: var(--fv-text);
}
.wrap { max-width:1100px; margin:0 auto; padding:1.5rem 1.25rem 2.5rem; }
.hero {
  background: linear-gradient(135deg, var(--fv-primary-dark), var(--fv-primary));
  color: var(--fv-on-primary); border-radius:1rem; padding:1.35rem 1.5rem;
  margin-bottom:1rem; box-shadow:0 0.75rem 2rem rgba(185,28,28,.22);
}
.hero-kicker { font-size:0.72rem; letter-spacing:.12em; text-transform:uppercase; opacity:.85; margin:0 0 .35rem; }
.hero h1 { margin:0; font-size:1.65rem; line-height:1.2; font-weight:800; }
.featured {
  display:none; margin:0 0 1rem; padding:0.9rem 1rem; border-radius:0.75rem;
  background:#fff; border-left:4px solid var(--fv-primary); border:1px solid #fecaca; border-left-width:4px;
  color:#7f1d1d; white-space:pre-wrap; font-size:0.95rem;
}
.featured.is-visible { display:block; }

.products { display:flex; flex-direction:column; gap:0.75rem; }
.product { display:grid; grid-template-columns:72px 1fr auto; gap:0.85rem; align-items:center; background:#fff; border:1px solid #e5e7eb; border-radius:0.75rem; padding:0.65rem 0.85rem; }
.product-img { width:72px; height:72px; background:#f3f4f6; border-radius:0.55rem; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.product-img img { max-width:100%; max-height:100%; object-fit:contain; }
.product-body { min-width:0; }
.product-sku { font-size:0.7rem; color:#6b7280; text-transform:uppercase; }
.product-name { font-size:0.95rem; font-weight:700; color:#1f2937; }
.product-price { font-size:1.05rem; font-weight:800; color:#ea580c; white-space:nowrap; }
.product-price.is-hidden { display:none; }

.empty {
  padding:2rem; text-align:center; color:var(--fv-muted); background:#fff;
  border:1px dashed #d1d5db; border-radius:0.85rem;
}
.footer {
  margin-top:1.5rem; text-align:center; font-size:0.75rem; color:var(--fv-muted);
}
@media (max-width:800px) {
  .products { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)) !important; }
  .product:first-child { grid-column:auto !important; display:block !important; }
}
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <p class="hero-kicker" data-slot="company">{{company_name}}</p>
      <h1 data-slot="title">{{catalog_name}}</h1>
    </header>
    <div class="featured" data-slot="message"></div>
    <div class="">
      <div class="products" data-slot="products" data-layout="list"></div>
    </div>
    <div class="empty" data-slot="empty" hidden></div>
    <p class="footer">FullVendor Catalog</p>
  </div>
</body>
</html>
