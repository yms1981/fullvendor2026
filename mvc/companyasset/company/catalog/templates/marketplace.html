<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{catalog_name}}</title>
<style>
:root {
  --fv-ink: #1c1917;
  --fv-muted: #9a3412;
  --fv-line: #fed7aa;
  --fv-accent: #ea580c;
  --fv-page: #fff7ed;
  --fv-card: #ffffff;
  --fv-banner-bg: #ea580c;
  --fv-banner-text: #fff7ed;
  --fv-footer-bg: #9a3412;
  --fv-footer-text: #ffedd5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: var(--fv-page);
  color: var(--fv-ink);
}
.banner {
  background: var(--fv-banner-bg);
  color: var(--fv-banner-text);
  padding: 1.35rem 1.25rem;
}
.banner .wrap-inner {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.brand img { max-height: 48px; max-width: 160px; object-fit: contain; }
.hero-kicker {
  margin: 0 0 0.3rem;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.85;
}
.banner h1 {
  margin: 0;
  font-size: 1.55rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: inherit;
}
.wrap { max-width: 1120px; margin: 0 auto; padding: 1.25rem 1rem 2.25rem; }
.featured {
  display: none;
  margin: 0 0 1.15rem;
  padding: 0.85rem 1rem;
  border-radius: 0.4rem;
  background: color-mix(in srgb, var(--fv-banner-bg) 8%, #fff);
  border: 1px solid var(--fv-line);
  color: var(--fv-ink);
  white-space: pre-wrap;
  font-size: 0.95rem;
  line-height: 1.5;
}
.featured.is-visible { display: block; }

.products {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
}
.product {
  background: var(--fv-card);
  border: 1px solid var(--fv-line);
  border-radius: 0.4rem;
  overflow: hidden;
}
.product-img {
  aspect-ratio: 1;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.product-img img { width:100%; height:100%; object-fit:contain; object-position:center; display:block; background:#fff; }
.product-body { padding: 0.8rem 0.85rem 0.95rem; }
@media (max-width: 900px) { .products { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.product-sku { font-size: 0.7rem; color: var(--fv-muted); letter-spacing: 0.05em; text-transform: uppercase; }
.product-name { margin: 0.25rem 0 0.4rem; font-size: 0.92rem; font-weight: 700; line-height: 1.3; color: var(--fv-ink); }
.product-price { margin: 0; font-size: 1rem; font-weight: 800; color: var(--fv-accent); }
.product-price.is-hidden { display: none; }
.empty {
  padding: 2rem;
  text-align: center;
  color: var(--fv-muted);
  border: 1px dashed var(--fv-line);
  border-radius: 0.35rem;
  background: var(--fv-card);
}
.footer {
  margin: 0;
  padding: 1.1rem 1.25rem;
  text-align: center;
  font-size: 0.75rem;
  background: var(--fv-footer-bg);
  color: var(--fv-footer-text);
}
.footer .wrap-inner { max-width: 1120px; margin: 0 auto; }
</style>
</head>
<body>
  <header class="banner" data-slot="banner">
    <div class="wrap-inner">
      <div class="fv-catalog-logo brand" data-slot="logo"></div>
      <div>
        <p class="hero-kicker" data-slot="company">{{company_name}}</p>
        <h1 data-slot="title">{{catalog_name}}</h1>
      </div>
      
    </div>
  </header>
  <div class="wrap">
    <div class="featured" data-slot="message"></div>
    <div class="products" data-slot="products" data-layout="grid"></div>
    <div class="empty" data-slot="empty" hidden></div>
  </div>
  <footer class="footer" data-slot="footer">
    <div class="wrap-inner">FullVendor Catalog</div>
  </footer>
</body>
</html>
