# El MVC (PHP 7.4) publica la API. Laravel (PHP 8.3) escucha en 127.0.0.1:81.
# Incluir este archivo dentro del VirtualHost del MVC, con mod_proxy y mod_proxy_http.
# Las peticiones de PHP del MVC no deben usar esta URL: van por API_INTERNAL_BASE_URL.

<Location "/api/v2/">
    ProxyPass "http://127.0.0.1:81/api/v2/"
    ProxyPassReverse "http://127.0.0.1:81/api/v2/"
</Location>

<Location "/api/v3/">
    ProxyPass "http://127.0.0.1:81/api/v3/"
    ProxyPassReverse "http://127.0.0.1:81/api/v3/"
</Location>

<Location "/docs">
    ProxyPass "http://127.0.0.1:81/api/v2/docs"
    ProxyPassReverse "http://127.0.0.1:81/api/v2/docs"
</Location>

<Location "/docs/">
    ProxyPass "http://127.0.0.1:81/api/v2/docs/"
    ProxyPassReverse "http://127.0.0.1:81/api/v2/docs/"
</Location>
