<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <!-- Professional abstract commerce / network mark — no letterforms -->
  <defs>
    <filter id="fvGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="82" stroke="#E10600" stroke-width="6" filter="url(#fvGlow)"/>
  <circle cx="100" cy="100" r="62" stroke="#E10600" stroke-width="2" opacity="0.35"/>
  <!-- diamond / network -->
  <path d="M100 46 L140 100 L100 154 L60 100 Z" stroke="#E10600" stroke-width="5.5" stroke-linejoin="round"/>
  <path d="M100 68 L122 100 L100 132 L78 100 Z" fill="#E10600" opacity="0.92"/>
  <!-- nodes -->
  <circle cx="100" cy="46" r="6.5" fill="#E10600"/>
  <circle cx="140" cy="100" r="6.5" fill="#E10600"/>
  <circle cx="100" cy="154" r="6.5" fill="#E10600"/>
  <circle cx="60" cy="100" r="6.5" fill="#E10600"/>
  <!-- growth tip -->
  <path d="M100 28 L108 44 H92 Z" fill="#E10600"/>
</svg>
