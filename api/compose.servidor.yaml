# API Laravel + MariaDB + Memcached + MinIO + Meilisearch (sin Sail).
# Ejecutar siempre desde el directorio api/ (donde está .env):
#
#   cd api
#   docker compose -f compose.servidor.yaml build
#   docker compose -f compose.servidor.yaml up -d
#
# Imagen API: fullvendor/api:8.3 (o la que definas en FULLVENDOR_API_IMAGE).
# Tras el build: docker tag fullvendor/api:8.3 TU_REGISTRY/fullvendor-api:8.3 && docker push ...
#
# Tras el primer up -d, sincronizar BD:
#   docker compose -f compose.servidor.yaml exec api php artisan schema:sync --force
#   (php artisan migrate --force hace lo mismo)

services:
  api:
    image: ${FULLVENDOR_API_IMAGE:-fullvendor/api:8.3}
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${API_HTTP_PORT:-8081}:80"
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      MEMCACHED_HOST: memcached
    volumes:
      - ../mvc/uploads:/var/www/mvc_uploads:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - fullvendor

  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cambiar_root}
      MYSQL_DATABASE: ${DB_DATABASE:-appfv}
      MYSQL_USER: ${DB_USERNAME:-appfv}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cambiar}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../docker/init.db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - fullvendor

  memcached:
    image: memcached:alpine
    restart: unless-stopped
    networks:
      - fullvendor

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":8900"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cambiar_minio}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-8900}:8900"
    networks:
      - fullvendor

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    ports:
      - "${MEILI_PORT:-7700}:7700"
    networks:
      - fullvendor

volumes:
  mariadb_data:
  minio_data:
  meili_data:

networks:
  fullvendor:
    driver: bridge
